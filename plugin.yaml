name: urbit-platform
label: Urbit
kind: platform
version: 0.1.0
description: >
  Urbit gateway adapter for Hermes Agent.
  Connects to an Urbit ship (moon) via Eyre HTTP and relays messages between
  a group chat channel and the Hermes agent. Uses SSE subscriptions for
  instant message delivery and JSON pokes for sending replies.
  Zero external dependencies beyond Hermes's existing aiohttp.
author: ~dinnyt-divsud

requires_env:
  - name: URBIT_SHIP_URL
    description: "Moon's Eyre URL (e.g. https://your-moon.startram.io)"
    prompt: "Urbit moon URL"
    password: false
  - name: URBIT_SHIP_NAME
    description: "Moon's @p identity (e.g. ~sampel-palnet-sampel-palnet)"
    prompt: "Moon ship name (@p)"
    password: false
  - name: URBIT_ACCESS_CODE
    description: "Moon's +code output (8-syllable access code)"
    prompt: "Access code"
    password: true
  - name: URBIT_OWNER_SHIP
    description: "Planet that owns this moon and hosts the C&C group (e.g. ~sampel-palnet)"
    prompt: "Owner planet (@p)"
    password: false

optional_env:
  - name: URBIT_GROUP_NAME
    description: "Group title to match if moon is in multiple groups (default: first group by owner)"
    prompt: "Group name (optional)"
    password: false
  - name: URBIT_MENTION_TRIGGERS
    description: "Comma-separated trigger strings; only respond when one appears in message (empty = respond to all)"
    prompt: "Mention triggers (optional, comma-separated)"
    password: false
  - name: URBIT_HOME_CHANNEL
    description: "Override auto-discovered channel nest for cron delivery (usually auto-detected)"
    prompt: "Home channel nest override (optional)"
    password: false
  - name: URBIT_ALLOWED_USERS
    description: "Comma-separated @p ships allowed to talk (empty = all group members)"
    prompt: "Allowed ships (optional, comma-separated)"
    password: false
  - name: URBIT_ALLOW_ALL_USERS
    description: "Allow any ship, not just group members (true/false, default: false)"
    prompt: "Allow all users? (true/false)"
    password: false
